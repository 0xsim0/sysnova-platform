services:
  web:
    build:
      context: .
    image: sysnova-web:dev
    env_file:
      - .env.homelab
    environment:
      EMAIL_PROVIDER: "mailpit"
      RESEND_API_KEY: ""
      ALLOWED_ORIGINS: "http://127.0.0.1:3001,http://127.0.0.1:3000"
      KV_REST_API_URL: ""
      ANALYTICS_ENABLED: "false"
      KV_REST_API_TOKEN: ""
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  proxy:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27.4@sha256:df6c2541907e1be6fac21f509927cf6ed771617a1f4b361ef66d97bd05593d2d
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    networks:
      monitoring:
        ipv4_address: 172.30.40.10
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=172.17.0.1:9100"

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    networks:
      - monitoring
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    restart: unless-stopped
    privileged: true
    cgroup: host
    networks:
      - monitoring
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg

  blackbox:
    image: quay.io/prometheus/blackbox-exporter:v0.29.1
    restart: unless-stopped
    networks:
      - default
      - monitoring
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/blackbox.yml"

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    networks:
      - monitoring
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/loki.yml"
  alloy:
    image: grafana/alloy:v1.21.2
    restart: unless-stopped
    user: "0:0"
    networks:
      - monitoring
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

networks:
  default: {}
  monitoring:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-sysnova-mon
    ipam:
      config:
        - subnet: 172.30.40.0/24
          gateway: 172.30.40.1