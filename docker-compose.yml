services:
  web:
    build:
      context: .
    environment:
      ALLOWED_ORIGINS: "http://127.0.0.1:3001"
      KV_REST_API_URL: ""
      KV_REST_API_TOKEN: ""
    image: sysnova-web:dev
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
